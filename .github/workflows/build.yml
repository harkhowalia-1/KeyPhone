name: Build apps

# Every change to the apps or the phone on main builds both apps and publishes
# them as the release named in the VERSION file (v1.0.0, …). Raise VERSION
# for a new release; otherwise the current release's files are replaced.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "phone/**"
      - "VERSION"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Version
        run: |
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: apple
        run: |
          ./make_web.sh
          xcodegen generate

      - name: Build iPhone app (.ipa)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Larch.xcodeproj -target Larch -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ios-build.log \
            || { grep -E "error:" ios-build.log | sort -u | head -40 | sed 's/^/::error::iOS /'; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/KeyPhone.app Payload/
          zip -qry ../KeyPhone.ipa Payload

      - name: Build Mac app
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Larch.xcodeproj -target LarchMac -configuration Release \
            SYMROOT="$PWD/build" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac-build.log \
            || { grep -E "error:" mac-build.log | sort -u | head -40 | sed 's/^/::error::Mac /'; exit 1; }
          codesign --force --deep --sign - "build/Release/KeyPhone.app"

      - name: Make disk image (.dmg)
        run: |
          rm -rf dmg && mkdir dmg
          cp -R "apple/build/Release/KeyPhone.app" dmg/
          if ! create-dmg \
              --volname "KeyPhone" \
              --volicon "apple/macOS/Assets.xcassets/AppIcon.appiconset/icon-512@2x.png" \
              --background "apple/dmg/background.png" \
              --window-pos 200 120 --window-size 600 400 --icon-size 112 \
              --icon "KeyPhone.app" 165 195 --hide-extension "KeyPhone.app" \
              --app-drop-link 435 195 \
              KeyPhone.dmg dmg/; then
            echo "Styled disk image failed; making a plain one"
            rm -f KeyPhone.dmg
            ln -s /Applications dmg/Applications
            hdiutil create -volname "KeyPhone" -srcfolder dmg -ov -format UDZO KeyPhone.dmg
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KeyPhone-${{ env.VERSION }}
          path: |
            KeyPhone.ipa
            KeyPhone.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: KeyPhone ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: |
            KeyPhone.ipa
            KeyPhone.dmg
