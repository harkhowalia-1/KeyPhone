name: Website

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/play
          cp -R site/. _site/
          sh apple/make_web.sh
          cp apple/Web/index.html _site/play/index.html
          cp -R apple/Web/j2me-lite _site/play/j2me-lite
          cp -R apple/Web/voip _site/play/voip
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
