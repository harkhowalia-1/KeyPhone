name: Move release tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retag.yml']
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Point each release tag at the matching commit on main
        run: |
          git fetch --tags --force
          git config user.name Harkhowalia
          git config user.email thiaraharkhowalia@gmail.com
          for t in $(git tag); do
            tree=$(git rev-parse "$t^{tree}")
            new=$(git log main --format='%H %T' | awk -v T="$tree" '$2==T{print $1; exit}')
            old=$(git rev-parse "$t^{commit}")
            if [ -n "$new" ] && [ "$new" != "$old" ]; then git tag -f "$t" "$new"; git push --force origin "refs/tags/$t"; echo "$t -> $new"; fi
          done
