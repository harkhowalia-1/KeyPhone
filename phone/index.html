<title>Larch K7 Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: phone on the left, a narrow workbench panel on the right; stacks on phones. */
:root{
  --page:#dfe4ea; --page2:#c9d0d9; --ink:#1b222b; --muted:#5b6674; --line:#b7c0cb; --accent:#2f6fb8; --card:#eef1f5;
  --f-ui:'Barlow',system-ui,sans-serif; --f-cond:'Barlow Semi Condensed','Barlow',system-ui,sans-serif; --f-lcd:'Fira Sans','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#15191f;--page2:#0e1115;--ink:#e3e8ee;--muted:#98a3b1;--line:#2c343e;--accent:#7fb2ee;--card:#1c2229;color-scheme:dark}}
:root[data-theme="dark"]{--page:#15191f;--page2:#0e1115;--ink:#e3e8ee;--muted:#98a3b1;--line:#2c343e;--accent:#7fb2ee;--card:#1c2229;color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 30% 20%,var(--page),var(--page2));color:var(--ink);font-family:var(--f-ui);padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow-x:hidden}
.stage{display:flex;justify-content:center;align-items:center;min-height:100%}
.wrap{position:relative;flex:none}
.panel{width:300px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.panel h1{font-family:var(--f-cond);font-size:28px;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{font-family:var(--f-cond);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 14px var(--f-ui);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.inp{font:15px var(--f-ui);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea.inp{height:80px;resize:vertical;font:12px ui-monospace,Menlo,monospace}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;color:var(--muted)}
.keys kbd{font:600 12px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap;justify-self:start}
.msg{font-size:13px;color:var(--accent);min-height:18px}

/* ---------- the handset (fixed product colours, not themed) ---------- */
.phone{position:absolute;left:0;top:0;width:280px;height:742px;transform-origin:0 0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.body{position:absolute;inset:0;border-radius:30px 30px 34px 34px;
  background:linear-gradient(90deg,#1d232a 0%,#5b6774 3.5%,#39424d 8%,#2a3139 50%,#39424d 92%,#5b6774 96.5%,#1d232a 100%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.face{position:absolute;left:9px;right:9px;top:9px;bottom:9px;border-radius:23px 23px 27px 27px;
  background:linear-gradient(180deg,#171b20 0%,#101317 42%,#171b20 43%,#1b2026 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ear{position:absolute;left:50%;top:16px;width:56px;height:6px;margin-left:-28px;border-radius:4px;background:repeating-linear-gradient(90deg,#05070a 0 3px,#2b3138 3px 5px);box-shadow:inset 0 1px 2px #000}
.brand{position:absolute;left:0;right:0;top:32px;text-align:center;font:600 11px/1 var(--f-cond),Arial,sans-serif;letter-spacing:.5em;color:#a7b1bd;padding-left:.5em}
.bezel{position:absolute;left:11px;top:56px;width:258px;height:338px;border-radius:6px;background:#020304;box-shadow:inset 0 0 0 1px #2a3037}
#lcd{position:absolute;left:9px;top:9px;width:240px;height:320px;overflow:hidden;font-family:var(--f-lcd);font-size:14px;line-height:1.2;color:var(--tfg);background:#000;cursor:default}
.glass{position:absolute;inset:0;border-radius:6px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%)}
.emu{position:absolute;left:24px;top:30px;width:28px;height:20px;border-radius:6px;cursor:pointer;z-index:2;display:grid;place-items:center;
  background:linear-gradient(180deg,#4a535e,#232930);box-shadow:0 0 0 1px #0b0e12,inset 0 1px 0 rgba(255,255,255,.22),0 2px 3px rgba(0,0,0,.6)}
.emu svg{width:14px;height:10px}
.emu:active,.emu.dn{filter:brightness(1.35);transform:translateY(.5px)}
.inner{position:absolute;left:0;top:0;width:280px;height:742px;pointer-events:none}
.inner>*{pointer-events:auto}
.pwr,.side,.emu{z-index:3}
.side i,.pwr i{display:none}
.embed{color-scheme:dark}
.embed,.embed body{padding:0!important;margin:0;overflow:hidden;background:transparent!important}
.embed .stage{min-height:0;height:100%}
.fsm,.fsm body{padding:0!important;margin:0;overflow:hidden;background:#14181d!important}
.fsm .stage{min-height:0;height:100%}
.phone.fs .body{border-radius:0;background:#14181d;box-shadow:none}
.phone.fs .face{inset:0;border-radius:0;box-shadow:none;background:linear-gradient(180deg,#14181d 0%,#101317 45%,#181c22 100%)}
.phone.fs .ear,.phone.fs .brand{display:none}
.phone.fs .emu{left:16px;top:33px;width:28px;height:20px}
.phone.fs .pwr,.phone.fs .side{top:33px;left:auto;width:26px;height:20px;border-radius:6px;display:grid;place-items:center;color:#d6dde5;
  background:linear-gradient(180deg,#4a535e,#232930);box-shadow:0 0 0 1px #0b0e12,inset 0 1px 0 rgba(255,255,255,.22),0 2px 3px rgba(0,0,0,.6)}
.phone.fs .pwr{right:16px}.phone.fs .side.vup{right:48px}.phone.fs .side.vdn{right:80px}
.phone.fs .side i,.phone.fs .pwr i{display:block;font:500 16px/1 Arial,sans-serif;font-style:normal}
.phone.fs .pwr i svg{display:block}
.phone.fs .pwr:active,.phone.fs .side:active,.phone.fs .pwr.dn,.phone.fs .side.dn{filter:brightness(1.35)}
.side{position:absolute;right:-5px;width:6px;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#3f4954,#8d99a6);cursor:pointer}
.side.vup{top:150px;height:34px}.side.vdn{top:188px;height:34px}
.pwr{position:absolute;top:-5px;left:176px;width:40px;height:6px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#8d99a6,#3f4954);cursor:pointer}
.ctl{position:absolute;left:11px;right:11px;top:404px;height:112px}
.k{position:absolute;cursor:pointer;display:grid;place-items:center}
.k:active,.k.dn{filter:brightness(1.35)}
.soft{width:66px;height:30px;top:2px;background:linear-gradient(180deg,#3a424c,#232930);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 3px rgba(0,0,0,.5)}
.soft i{display:block;width:22px;height:3px;border-radius:2px;background:#c4ccd5}
.soft.l{left:0;border-radius:6px 16px 6px 6px}.soft.r{right:0;border-radius:16px 6px 6px 6px}
.cl,.en{width:66px;height:38px;top:62px;background:linear-gradient(180deg,#3a424c,#232930);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 3px rgba(0,0,0,.5)}
.cl{left:0;border-radius:6px 6px 6px 18px}.en{right:0;border-radius:6px 6px 18px 6px}
.cl svg,.en svg{width:22px;height:22px}
.pad{position:absolute;left:50%;top:0;width:110px;height:110px;margin-left:-55px;border-radius:50%;
  background:conic-gradient(from 0deg,#aab4bf,#e7ecf1,#aab4bf,#7d8895,#aab4bf,#e7ecf1,#aab4bf,#7d8895,#aab4bf);box-shadow:0 3px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.35)}
.pad .dz{position:absolute;width:38px;height:38px;display:grid;place-items:center}
.pad .dz i{width:0;height:0;border:5px solid transparent}
.dz.u{left:36px;top:0}.dz.u i{border-bottom-color:#3a434d;margin-top:-6px}
.dz.d{left:36px;bottom:0}.dz.d i{border-top-color:#3a434d;margin-bottom:-6px}
.dz.lt{left:0;top:36px}.dz.lt i{border-right-color:#3a434d;margin-left:-6px}
.dz.rt{right:0;top:36px}.dz.rt i{border-left-color:#3a434d;margin-right:-6px}
.pad .ok{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a535e,#1c2127);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 2px #11151a}
.kp{position:absolute;left:14px;right:14px;top:528px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px 8px}
.kk{position:relative;height:40px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(180deg,#e9edf1,#b6bfc9);box-shadow:inset 0 1px 0 #fff,0 2px 0 #6d7884,0 3px 4px rgba(0,0,0,.45);color:#1a2027}
.kk:nth-child(3n+1){border-radius:9px 9px 9px 14px}.kk:nth-child(3n){border-radius:9px 9px 14px 9px}
.kk:active,.kk.dn{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #6d7884,0 1px 2px rgba(0,0,0,.4)}
.kk b{font:500 20px/1 var(--f-lcd)}
.kk small{font:600 9px/1 var(--f-cond);letter-spacing:.08em;color:#4a5562;text-transform:uppercase}
.mic{position:absolute;left:50%;bottom:20px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#000}
.phone.vib{animation:vib .12s linear infinite}
@keyframes vib{0%{transform:var(--sc) translateX(0)}25%{transform:var(--sc) translateX(-1.5px)}75%{transform:var(--sc) translateX(1.5px)}}

/* ---------- LCD ---------- */
#scr{position:absolute;inset:0;background:var(--tbg);z-index:1}
#scr.live{background:transparent}
#livewall{position:absolute;left:0;top:0;width:240px;height:320px;z-index:0;display:block}
#livewall[hidden]{display:none}
#scr.off{background:#000}
.hd{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;gap:6px;padding:0 7px;background:var(--thd);color:var(--thdfg);font-weight:500;font-size:14px}
.hd .ht{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hr{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.bd{position:absolute;left:0;right:0;top:26px;bottom:28px;overflow:hidden}
.full .bd{top:0}
.sk{position:absolute;left:0;right:0;bottom:0;height:28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 7px;background:var(--tsk);color:var(--tskfg);font-weight:500;font-size:14px}
.sk span{cursor:pointer;white-space:nowrap}
.sk .skm{text-align:center;padding:0 6px}.sk .skr{text-align:right}
.sk.ov{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ls{position:absolute;inset:0}
.li{height:33px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;border-bottom:1px solid rgba(127,127,127,.14);cursor:pointer}
.li.two{height:47px}
.li.on{background:var(--thl);color:var(--thlfg)}
.li .lt{flex:1;min-width:0}
.li b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.unread b{font-weight:600}
.li small{display:block;font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lic{width:22px;height:22px;flex:none;display:grid;place-items:center}
.lic svg{width:20px;height:20px}
.lic img{width:22px;height:22px;object-fit:cover;border-radius:3px}
.rb{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;flex:none;opacity:.8;display:grid;place-items:center}
.rb.on::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cb{width:12px;height:12px;border:2px solid currentColor;border-radius:2px;flex:none;opacity:.8;display:grid;place-items:center;font-size:11px;line-height:1}
.cb.on::after{content:"✓";font-weight:700}
.sbar{position:absolute;right:1px;top:2px;bottom:2px;width:3px;border-radius:2px;background:rgba(127,127,127,.18)}
.sbar i{position:absolute;left:0;right:0;border-radius:2px;background:var(--tsub)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--tsub);font-size:14px}
.foot{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;padding:0 8px;background:var(--tsolid);border-top:1px solid rgba(127,127,127,.3);font-size:13px}
.txt{padding:8px 10px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;overflow:hidden;height:100%;box-sizing:border-box}
.txt .lbl{color:var(--tsub);font-size:12px;display:block;margin-bottom:2px}
.txt p{margin:0 0 6px}
.fs-small{font-size:12px}.fs-large{font-size:17px}
.ed{padding:6px 9px;height:100%;box-sizing:border-box;overflow:hidden;white-space:pre-wrap;word-wrap:break-word;line-height:1.35}
.ed .lbl{display:block;color:var(--tsub);font-size:12px;margin-bottom:3px}
.ed .box{display:block;min-height:22px;border-bottom:1px solid rgba(127,127,127,.4);padding-bottom:2px}
.cr{display:inline-block;width:1.5px;height:1.05em;background:currentColor;vertical-align:-2px;margin:0 -0.75px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.mt{background:var(--thl);color:var(--thlfg)}
.tw{text-decoration:underline;text-underline-offset:2px}
.tw.miss{color:#d33}
.dial{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px 12px;font-weight:300;word-break:break-all;text-align:right;line-height:1.05;font-variant-numeric:tabular-nums}
.dlgw{position:absolute;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{background:var(--tsolid);color:var(--tfg);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);padding:14px;text-align:center;width:100%;box-sizing:border-box;border:1px solid rgba(127,127,127,.35)}
.dlg .dq{width:30px;height:30px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:#3f7fd1}
.dlg p{margin:0;font-size:15px;line-height:1.3}
#note[hidden]{display:none}
.gal{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:85px;gap:3px;padding:3px;align-content:start}
.gal div{position:relative;background:#16181b center/cover no-repeat;border-radius:3px;cursor:pointer}
.gal div.on{box-shadow:0 0 0 3px var(--tsolid),0 0 0 5px #3f8cff}
.gal span{position:absolute;right:3px;bottom:3px;font-size:10px;line-height:14px;color:#fff;background:rgba(0,0,0,.65);padding:0 4px;border-radius:3px;font-variant-numeric:tabular-nums}
.rec{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.rec .rmic{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--thl);color:var(--thlfg)}
.rec .rmic.on{background:#d33b2f;color:#fff;animation:pulse 1.2s ease-in-out infinite}
.rec .rmic svg{width:38px;height:38px}
.rec .t{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.rec .st{color:var(--tsub);font-size:13px}
.rec .rlv{width:70%;height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
.rec .rlv i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f9a4a,#e0b020,#d33b2f);transition:width .12s}
.snap{position:absolute;inset:0;background:#000 center/contain no-repeat}
.vbar{position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;gap:8px;padding:0 8px;font-variant-numeric:tabular-nums}
#jvm,#webl{position:absolute;z-index:4}
#jvm{inset:0;background:#000}
#jvm iframe,#webl iframe{display:block;width:100%;height:100%;border:0;background:transparent}
#webl{left:0;right:0;top:26px;bottom:28px;background:#fff}
#jvm[hidden],#webl[hidden]{display:none}
#note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#note .nb{background:var(--tsolid);color:var(--tfg);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.45);padding:14px 12px;text-align:center;width:100%;border:1px solid rgba(127,127,127,.35)}
#note .ni{width:32px;height:32px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.ni.ok{background:#2f9a4a}.ni.info{background:#3f7fd1}.ni.warn{background:#d0682a}.ni.wait{background:#6b6fd6}
#note p{margin:0;font-size:15px;line-height:1.3}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
/* standby */
.sb{position:absolute;inset:0;color:var(--sf)}
.sb .sig{position:absolute;left:5px;top:6px}
.sb .bat{position:absolute;right:5px;top:6px}
.sb .icr{position:absolute;left:24px;right:24px;top:6px;display:flex;justify-content:center;gap:5px}
.sb .icr svg{width:14px;height:14px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.sb .op{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:17px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.sb .clk{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:44px;font-weight:300;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.sb .clk small{font-size:16px;margin-left:3px}
.sb .dt{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.sb .pf{position:absolute;left:0;right:0;top:140px;text-align:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7);opacity:.95}
.sb .as{position:absolute;left:10px;right:10px;bottom:36px;display:flex;flex-direction:column;gap:4px}
.sb .as div{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.38);border-radius:6px;padding:4px 7px;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .as svg{width:14px;height:14px;flex:none}
.sb .nv{position:absolute;left:50%;bottom:40px;width:56px;height:56px;margin-left:-28px;opacity:.75}
.lock{position:absolute;left:0;right:0;bottom:44px;text-align:center}
.lock span{display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,.5);color:#fff;border-radius:12px;padding:3px 10px;font-size:12px}
/* menu grid */
.gm{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;gap:3px}
.gi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;cursor:pointer}
.gi.on{background:var(--thl);color:var(--thlfg)}
.tile{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 14px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.3);transition:transform .12s}
.tile svg{width:28px;height:28px}
.gi.on .tile{transform:scale(1.1)}
.gi span{font-size:11px;white-space:nowrap}
.gm.lbl .tile{width:42px;height:42px}.gm.lbl .tile svg{width:24px;height:24px}
.help{position:absolute;left:8px;right:8px;bottom:6px;background:#fffbe0;color:#2a2410;border:1px solid #c9b960;border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.3)}
/* call */
.call{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px}
.call .av{width:64px;height:64px;border-radius:50%;background:var(--thl);color:var(--thlfg);display:grid;place-items:center;margin-bottom:6px}
.call .av svg{width:38px;height:38px}
.call .nm{font-size:19px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

let S;

  if(S.alarm.on){ if(S.alarm.rep) S.alarm.days.forEach(d=>items.push({id:'alarm-'+d,title:'Alarm',body:fmtTime(new Date(2000,0,1,S.alarm.h,S.alarm.m)),hour:S.alarm.h,minute:S.alarm.m,weekday:d+1,repeats:true}));
    else { const t=new Date(nowP); t.setHours(S.alarm.h,S.alarm.m,0,0); if(t<=nowP) t.setDate(t.getDate()+1); items.push({id:'alarm',title:'Alarm',body:fmtTime(t),at:t.getTime()-off}) } }

/* ---------------- time ---------------- */

function fmtDate(d){ const D=pad2(d.getDate()),M=pad2(d.getMonth()+1),Y=d.getFullYear(),s=S.date.sep;
  return {'DD-MM-YYYY':D+s+M+s+Y,'MM-DD-YYYY':M+s+D+s+Y,'YYYY-MM-DD':Y+s+M+s+D,'DD-MM-YY':D+s+M+s+String(Y).slice(2),'MM-DD-YY':M+s+D+s+String(Y).slice(2),'YY-MM-DD':String(Y).slice(2)+s+M+s+D}[S.date.fmt]||D+s+M+s+Y }
const dkey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function fmtStamp(t){ const d=new Date(t+S.clock.off); return dkey(d)===dkey(now())?fmtTime(d):fmtDate(d)+' '+fmtTime(d) }
const fmtDur=s=>pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s/60)%60)+':'+pad2(Math.floor(s)%60);

/* ---------------- sound ---------------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null} } if(AC&&AC.state==='suspended') AC.resume(); return AC }
const RING={
  'Larch theme':'E5 8,G5 8,B5 8,E6 4,D6 8,B5 8,G5 4,R 4,A5 8,B5 8,D6 8,B5 4,G5 4',
  'Spring':'C6 16,E6 16,G6 8,E6 16,C6 16,D6 8,R 8,C6 16,E6 16,G6 8,A6 8,G6 4',
  'Old bell':'A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,R 4,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32,A5 32,F5 32',
  'Pulse':'C5 16,R 16,C5 16,R 16,G5 8,R 8,C5 16,R 16,C5 16,R 16,A#5 8',
  'Waltz in G':'G5 4,B5 8,D6 8,G6 4,F#6 8,E6 8,D6 2,C6 8,B5 8,A5 4,F#5 8,A5 8,G5 2',
  'Bleeps':'E6 16,R 16,E6 16,R 16,E6 16,R 8,G6 16,R 16,G6 16,R 4',
  'Lantern':'D6 8,A5 8,F#5 8,A5 8,D6 8,E6 8,F#6 4,E6 8,D6 8,C#6 8,A5 8,B5 4'
};
const MSGT={'Beep':'A6 16','Twin':'E6 16,R 32,E6 16','Rise':'C6 16,E6 16,G6 16,C7 8','Drop':'G6 16,E6 16,C6 8','Chime':'G6 8,C7 8,E7 4'};
const ALARMT={'Alarm':'A6 16,R 16,A6 16,R 16,A6 16,R 16,A6 16,R 4','Rooster':'C6 16,E6 16,G6 16,C7 4,R 8,C7 16,G6 16,E6 16,C6 4','Larch theme':RING['Larch theme']};
function noteF(n){ const m=/^([A-G])(#?)(\d)$/.exec(n); const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12) }

function playSeq(str,o={}){ const a=ac(); const vol=o.vol==null?.12:o.vol; if(!a||!vol||!str) return {stop(){}};

  const run=()=>{ if(stopped) return; let t=a.currentTime+.03; const g0=Math.min(.32,vol+(o.step||0)*rep);
    for(const n of notes){ if(n.f){ const os=a.createOscillator(),g=a.createGain(); os.type=o.wave||'square'; os.frequency.value=n.f;

const volG=v=>[0,.03,.06,.1,.15,.22][v]||0;
const DTMF={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};

/* ---------------- icons (original line art) ---------------- */
const P={
  msg:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3.5 7.5 12 13l8.5-5.5"/>',

  const W=240,H=320; const c=document.createElement('canvas'); c.width=W*2; c.height=H*2; const x=c.getContext('2d');

  // a larch: a thin trunk with drooping tiers that narrow toward a sharp top
  function larch(g,x,base,h,col){ g.fillStyle=col; g.fillRect(x-h*.012,base-h*.15,h*.024,h*.15); const tiers=7;
    for(let i=0;i<tiers;i++){ const f=i/tiers, y=base-h*.1-f*h*.86, w=h*.22*(1-f*.85), th=h*.2;
      g.beginPath(); g.moveTo(x,y-th); g.quadraticCurveTo(x-w*.35,y-th*.35,x-w,y+th*.08); g.lineTo(x-w*.55,y-th*.05); g.lineTo(x,y+th*.02); g.lineTo(x+w*.55,y-th*.05); g.lineTo(x+w,y+th*.08); g.quadraticCurveTo(x+w*.35,y-th*.35,x,y-th); g.fill() }
    g.beginPath(); g.moveTo(x,base-h*1.04); g.lineTo(x-h*.02,base-h*.9); g.lineTo(x+h*.02,base-h*.9); g.fill() }

  function forest(W,base,amp,f,ph,col,count,hmin,hmax,seed){ const [c,g]=off(W,330); ridge(g,W,base,amp,f,ph,col); const r=rng(seed);
    for(let i=0;i<count;i++){ const x=r()*W, y=base+Math.sin(x*f+ph)*amp+Math.sin(x*f*2.7+ph*1.7)*amp*.35+4; larch(g,x,y,hmin+r()*(hmax-hmin),col) } return c }

  const SCENES={
    dawn:{n:'Larch dawn (live)',
      build(){ layers={far:forest(280,214,9,.021,1.2,'#6b4a7c',26,16,30,3),mid:forest(290,244,11,.017,2.4,'#3c2752',22,26,48,5),near:forest(300,284,8,.013,.6,'#140c1f',14,52,96,9),

function callNumber(num,label){ num=String(num||'').trim(); if(!num) return;
  if(S.profile==='flight'){ note('Flight profile is active','warn'); return }
  S.logs.dialled.unshift({num,t:Date.now(),dur:0}); S.logs.dialled=S.logs.dialled.slice(0,30); save();
  const name=label||nameFor(num);
  if(Host&&Host.call){ Host.call(num).catch(()=>note('Could not place the call','warn')); home(); note('Calling '+name,'info',1600); return }
  const a=document.createElement('a'); a.href='tel:'+num.replace(/[^\d+*#,;]/g,''); a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  home(); Info('Calling',`<p><b>${esc(name)}</b></p><p>${esc(num)}</p><p>The call was handed to this device's phone app. If nothing opened, this device can't place calls.</p>`) }
window.LarchCallEnded=o=>{ const d=Math.round((o&&o.duration)||0); if(!d) return; S.dur.last=d; S.dur.dialled+=d; if(S.logs.dialled[0]) S.logs.dialled[0].dur=d; save(); if(S.call.summary&&S.on) note('Call duration '+fmtDur(d),'info',2200) };

function answer(){ if(!callObj||callObj.state!=='ringing') return; stopRing(); clearTimeout(callObj.tm); callObj.state='active'; callObj.t0=Date.now();
  S.logs.recv.unshift({num:callObj.num,t:Date.now(),dur:0}); S.logs.recv=S.logs.recv.slice(0,20); save(); render() }
function endCall(silent){ if(!callObj) return; clearTimeout(callObj.tm); stopRing(); stopRingback();
  const dur=callObj.state==='active'?Math.round((Date.now()-callObj.t0)/1000):0;
  if(dur){ S.dur.last=dur; if(callObj.dir==='in'){ S.dur.recv+=dur; if(S.logs.recv[0]) S.logs.recv[0].dur=dur } else { S.dur.dialled+=dur; if(S.logs.dialled[0]) S.logs.dialled[0].dur=dur } save() }
  callObj=null; home(); if(!silent){ if(dur&&S.call.summary) note('Call duration '+fmtDur(dur),'info',1800); else note('Call ended','info',900) } }
function CallView(){ return {name:'call',full:true,noPower:true,cls:'',
  draw(el){ const c=callObj; if(!c){ return } el.style.background='var(--tbg)';
    const st=c.state==='calling'?'Calling':c.state==='ringing'?'Calling…':(c.mute?'Muted':'Active call')+(c.spk?' · Loudspeaker':'');
    el.innerHTML=`<div class="call${c.state!=='active'?' ring':''}"><div class="av">${ico('person')}</div><div class="nm">${esc(c.name)}</div>${c.name!==c.num?`<div class="st">${esc(c.num)}</div>`:''}<div class="st">${st}</div>${c.state==='active'?`<div class="tm">${fmtDur((Date.now()-c.t0)/1000)}</div>`:''}</div>` },
  tick(){ render() },
  soft(){ const c=callObj; if(!c) return [{},{},{}];
    if(c.state==='ringing') return [{t:'Options',f:()=>menu('Options',[['Answer',()=>{pop();answer()}],['Reject',()=>{pop();endCall()}]],{nums:false})},{t:'Answer',f:answer},{t:c.silenced?'Reject':'Silence',f:()=>{ if(c.silenced) endCall(); else { c.silenced=true; stopRing(); render() } }}];
    if(c.state==='calling') return [{t:''},{t:''},{t:'End',f:()=>endCall()}];
    return [{t:'Options',f:()=>menu('Options',[[c.mute?'Unmute':'Mute',()=>{c.mute=!c.mute;pop()}],['Hold',()=>{pop();note('Call on hold','info')}],['Contacts',()=>{pop();NamesList()}],['Menu',()=>{pop();push(MainMenu())}],['End call',()=>{pop();endCall()}]],{nums:false})},{t:''},{t:c.spk?'Normal':'Loudsp.',f:()=>{c.spk=!c.spk;render()}}] },
  key(k){ const c=callObj; if(!c) return false;
    if(k==='END'){ endCall(); return true }
    if(k==='CALL'&&c.state==='ringing'){ answer(); return true }
    if(c.state==='ringing'&&S.call.anykey&&!['R','END','PWR','VUP','VDN'].includes(k)){ answer(); return true }
    if(c.state==='ringing'&&(k==='VUP'||k==='VDN')){ stopRing(); c.silenced=true; render(); return true }
    if(c.state==='active'&&/^[\d*#]$/.test(k)) return true;
    return false } } }

    L:()=>({t:'Options',f:()=>ContactOptions(c)}), M:it=>['num','home','work'].includes(it.k)?{t:'Call',f:()=>callNumber(it.t,c.name)}:{t:''},
    key(k){ if(k==='CALL'){ callNumber(c.num,c.name); return true } return false } })) }
function ContactOptions(c){ menu('Options',[['View',()=>{pop();ContactView(c)}],['Call',()=>{pop();callNumber(c.num,c.name)}],['Send message',()=>{pop();NewMessage('',c.num)}],['Edit',()=>{pop();EditContact(c)}],
  ['Add detail',()=>{pop();menu('Add detail',[['Home number',()=>editField(c,'home','Home:','phone')],['Work number',()=>editField(c,'work','Work:','phone')],['E-mail',()=>editField(c,'email','E-mail:','text')],['Note',()=>editField(c,'note','Note:','text')]],{nums:false})}],
  ['Add to group',()=>{pop();Radio('Group',[['','No group'],...S.groups.map(g=>[g,g])],()=>c.group||'',v=>c.group=v,{note:'Saved'})}],
  ['Assign speed dial',()=>{pop();Radio('Speed dial key',['2','3','4','5','6','7','8','9'].map(k=>[k,k+(S.speed[k]?' · '+(S.contacts.find(x=>x.id===S.speed[k])||{}).name:'')]),()=>Object.keys(S.speed).find(k=>S.speed[k]===c.id),v=>S.speed[v]=c.id,{note:'Saved'})}],
  ['Business card',()=>{pop();Info('Business card',`<p><b>${esc(c.name)}</b></p><p>${esc(c.num)}</p>${c.email?`<p>${esc(c.email)}</p>`:''}`)}],
  ['Delete contact',()=>{pop();Ask('Delete '+c.name+'?',()=>{dropContact(c);S.contacts=S.contacts.filter(x=>x!==c);for(const k in S.speed) if(S.speed[k]===c.id) delete S.speed[k];save();popTo('names');note('Deleted')})}]],{nums:false}) }

  push(List(title,()=>S.logs[key].map(x=>({t:nameFor(x.num),s:fmtStamp(x.t),x,ic:ico(key==='missed'?'missed':key==='recv'?'inc':key==='msgTo'?'msg':'out')})),{two:true,empty:'No numbers',
    M:it=>({t:key==='msgTo'?'Send':'Call',f:()=>key==='msgTo'?NewMessage('',it.x.num):callNumber(it.x.num)}),

  if(k==='PWR'){ if(v.name==='standby'&&!locked) ProfilesQuick(); return }
  if(k==='EMU'){ if(locked){ note('Press Unlock, then *','info',1300); return } if(v.name==='call'||v.name==='alarmv') return; if(v.name==='emu') { pop(); return } EmulatorMenu(); return }

  if(long&&k!=='END') return dispatch(k,false);

  if(k==='L'||k==='M'||k==='R'){ const s=v.soft?v.soft():[]; const x=s[{L:0,M:1,R:2}[k]]; if(x&&x.f) x.f() }

function up(k){ if(downK!==k) return; clearTimeout(lt); clearTimeout(rpt); clearInterval(rptI); downK=null; if(javaOn()){ javaKey(k,false); return } if(!fired) dispatch(k,false) }

const KP=[['1','',''],['2','abc'],['3','def'],['4','ghi'],['5','jkl'],['6','mno'],['7','pqrs'],['8','tuv'],['9','wxyz'],['*','+'],['0','␣'],['#','⇧']];

const KMAP={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'LT',ArrowRight:'RT',Enter:'M','[':'L',']':'R',Backspace:'R','=':'CALL',Escape:'END',PageUp:'VUP',PageDown:'VDN','\\':'EMU'};

function pickFiles(){ try{ $('#fin').click() }catch(e){ note('Could not open files','warn') } }
function copyBackup(){ const txt=JSON.stringify(S); const fail=()=>note('Clipboard not available here','warn',1800);

function restoreView(){ push({name:'restore',title:'Restore backup',
  draw(el){ el.innerHTML='<div class="txt"><p>Paste a backup now.</p><p><span class="lbl">On a Mac</span>Press ⌘V.</p><p>This replaces the contacts, messages, settings and files on this phone.</p></div>' },

    Ask('Replace this phone with the backup?',()=>{ S=deepMerge(clone(DEF),o); S.mig2=true; save(); note('Backup restored','ok',1200,()=>{ powerOff(); setTimeout(powerOn,600) }) }) } }) }
document.addEventListener('paste',e=>{ const v=tv(); if(!S.on||!v||booting) return; const t=(e.clipboardData||window.clipboardData).getData('text'); if(!t) return;
  if(v.onPaste){ e.preventDefault(); v.onPaste(t); return }
  if(v.typeChar){ e.preventDefault(); if(v.ins){ if(v.commit) v.commit(); v.mt=null; v.ins(t.slice(0,2000)); render() } else t.split('').forEach(c=>v.typeChar(c)) } });
['#pin','#cin'].forEach(sel=>$(sel).addEventListener('change',async e=>{ const files=[...e.target.files]; e.target.value=''; const list=[]; for(const f of files){ try{ list.push({name:f.name.replace(/\.[^.]+$/,''),data:await readAs(f,'readAsDataURL')}) }catch(err){} } storePhotos(list) }));
$('#fin').addEventListener('change',async e=>{ const files=[...e.target.files]; e.target.value=''; if(!files.length) return; const done=[];
  for(const f of files){ try{ done.push(await importFile(f)) }catch(err){ done.push(f.name+': could not be read') } }
  if(S.on&&V.length){ render(); Info('Files added','<p>'+done.map(esc).join('</p><p>')+'</p>') } });
function readAs(f,how){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r[how](f) }) }
function shrink(src,w,h,q){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,Math.max(w/im.width,h/im.height)); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q||.85)) }; im.onerror=()=>res(null); im.src=src }) }
async function unzip(file){ const buf=new Uint8Array(await file.arrayBuffer()); const dv=new DataView(buf.buffer); let e=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break } } if(e<0) throw new Error('not a zip');
  const cnt=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const ents={}; const td=new TextDecoder();
  for(let k=0;k<cnt;k++){ if(dv.getUint32(p,true)!==0x02014b50) break; const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    ents[td.decode(buf.subarray(p+46,p+46+nl))]={method,csize,off}; p+=46+nl+xl+cl }
  async function bytes(name){ const en=ents[name]; if(!en) return null; const o=en.off, nl=dv.getUint16(o+26,true), xl=dv.getUint16(o+28,true); const data=buf.subarray(o+30+nl+xl,o+30+nl+xl+en.csize);
    if(en.method===0) return data; if(en.method!==8) throw new Error('compression'); const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Uint8Array(await new Response(st).arrayBuffer()) }
  return {names:Object.keys(ents), text:async n=>{ const b=await bytes(n); return b?td.decode(b):'' },
    b64:async n=>{ const b=await bytes(n); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s) }} }
/* ---------------- installing Java applications ---------------- */
async function readJar(f,z){ z=z||await unzip(f); const mfn=z.names.find(x=>x.toUpperCase()==='META-INF/MANIFEST.MF'); if(!mfn) throw new Error('not a MIDlet');
  const mf=await z.text(mfn); const lines=mf.replace(/\r?\n /g,'').split(/\r?\n/); const get=k=>{ const l=lines.find(x=>x.toLowerCase().startsWith(k.toLowerCase()+':')); return l?l.slice(k.length+1).trim():'' };
  const m1=get('MIDlet-1').split(',').map(x=>x.trim()); if(!m1[0]&&!get('MIDlet-Name')) throw new Error('not a MIDlet');
  const ipath=(get('MIDlet-Icon')||m1[1]||'').replace(/^\//,''); const ip=ipath&&z.names.find(x=>x.toLowerCase()===ipath.toLowerCase()); const icon=ip?'data:image/png;base64,'+await z.b64(ip):null;
  return {id:uid(),name:get('MIDlet-Name')||m1[0]||f.name.replace(/\.jar$/i,''),vendor:get('MIDlet-Vendor'),ver:get('MIDlet-Version'),main:m1[2]||'',profile:get('MicroEdition-Profile'),size:f.size,icon,file:f.name,game:false,added:Date.now()} }
async function saveJar(j,f){ await Blobs.put('jar:'+j.id,await f.arrayBuffer()); const back=await Blobs.get('jar:'+j.id); if(!back||back.byteLength!==f.size) throw new Error('not saved');
  const old=S.jars.find(x=>x.name===j.name&&(x.vendor||'')===(j.vendor||'')); if(old){ j.game=old.game; Blobs.del('jar:'+old.id); S.jars=S.jars.filter(x=>x!==old) }
  j.stored=true; S.jars.push(j); save(); return j }
const kb=n=>Math.max(1,Math.round(n/1024))+' kB';
async function installFlow(f){ let j; try{ j=await readJar(f) }catch(e){ note('This file is not a Java application','warn',2200); return }
  const old=S.jars.find(x=>x.name===j.name&&(x.vendor||'')===(j.vendor||''));
  Ask((old?'Replace ':'Install ')+j.name+'?'+(j.vendor?' '+j.vendor:'')+(j.ver?' · v'+j.ver:'')+' · '+kb(j.size),async()=>{
    note('Installing','wait',60000);
    try{ await saveJar(j,f); endNote(); Ask(j.name+' installed. Open it now?',()=>openJar(j)) }
    catch(e){ endNote(); note('Phone memory full. The application was not installed.','warn',2600) } }) }
function pickApps(){ try{ $('#ain').click() }catch(e){ note('Could not open files','warn') } }
$('#ain').addEventListener('change',async e=>{ const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  const jars=files.filter(f=>/\.jar$/i.test(f.name)), jads=files.filter(f=>/\.jad$/i.test(f.name));
  if(jars.length===1) return installFlow(jars[0]);
  if(jars.length>1){ note('Installing','wait',120000); let ok=0; for(const f of jars){ try{ await saveJar(await readJar(f),f); ok++ }catch(err){} } endNote(); render(); note(ok+' of '+jars.length+' applications installed',ok?'ok':'warn',2000); return }
  if(jads.length){ const t=await readAs(jads[0],'readAsText'); const m=t.match(/MIDlet-Jar-URL:\s*(\S+)/i);
    if(m&&/^https?:/i.test(m[1])) return installFromUrl(m[1].trim()); note('Choose the .jar file that goes with this .jad','info',2400) } });
async function fetchBytes(u){
  if(Host&&Host.download){ const r=await Host.download(u); return {name:r.name||'',buf:fromB64(r.data),url:r.url||u} }
  const res=await fetch(u); if(!res.ok) throw new Error('http '+res.status); return {name:decodeURIComponent(((res.url||u).split('?')[0].split('/').pop())||''),buf:await res.arrayBuffer(),url:res.url||u} }
async function installFromUrl(u){ if(!dev.online){ note('No network connection','warn'); return }
  note('Downloading','wait',180000);
  try{ let r=await fetchBytes(u);
    if(/\.jad$/i.test(r.name)||/\.jad(\?|#|$)/i.test(u)){ const t=new TextDecoder().decode(r.buf); const m=t.match(/MIDlet-Jar-URL:\s*(\S+)/i); if(!m) throw new Error('jad'); r=await fetchBytes(new URL(m[1].trim(),r.url).href) }
    endNote(); const name=/\.jar$/i.test(r.name)?r.name:(r.name||'application')+'.jar'; installFlow(new File([r.buf],name,{type:'application/java-archive'})) }
  catch(e){ endNote(); note(Host&&Host.download?'Download failed':'This site blocks downloads into the phone here. Download the file, then use Install new.','warn',2800) } }
window.LarchOfferInstall=u=>{ Ask('Download and install this application?',()=>installFromUrl(u)) };
function installFromWeb(){ push(Editor({mode:'text',noPred:true,lower:true,title:'Install from web',label:'Address of a .jar or .jad file:',text:'https://',done(t){ pop(); t=t.trim(); if(t&&t!=='https://') installFromUrl(/^https?:/i.test(t)?t:'https://'+t) }})) }

async function importFile(f){ const n=f.name, ext=n.split('.').pop().toLowerCase();
  if(f.type.startsWith('image/')){ const d=await shrink(await readAs(f,'readAsDataURL'),480,640,.82); if(!d) throw 0; S.images.push({id:'i:'+uid(),n:n.replace(/\.[^.]+$/,''),data:d}); save(); return n+' → Gallery' }
  if(f.type.startsWith('audio/')){ music.tracks.push({name:n.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}); return n+' → Music player (until the app closes)' }
  if(ext==='jad'){ const t=await readAs(f,'readAsText'); const nm=(t.match(/MIDlet-Name:\s*(.+)/)||[])[1]; return n+': '+(nm?nm.trim()+' needs its .jar file':'needs its .jar file') }
  if(ext==='jar'||ext==='nth'||ext==='zip'){ const z=await unzip(f); const mfn=z.names.find(x=>x.toUpperCase()==='META-INF/MANIFEST.MF');
    if(ext==='jar'||mfn){ const j=await readJar(f,z); await saveJar(j,f); return j.name+' installed' }
    const imgs=z.names.filter(x=>/\.(png|jpe?g|gif|bmp)$/i.test(x)); const tx=z.names.find(x=>/\.xml$/i.test(x)); const xml=tx?await z.text(tx):'';
    const pickBy=re=>imgs.find(x=>re.test(x.split('/').pop())); const wp=pickBy(/wall|wp|standby|idle/i)||imgs[0], bg=pickBy(/bg|back|main/i)||wp;
    const toURL=async x=>x?await shrink('data:image/'+(/\.png$/i.test(x)?'png':'jpeg')+';base64,'+await z.b64(x),480,640,.8):null;
    const th={id:'u'+uid(),n:((xml.match(/name="([^"]+)"/)||[])[1]||n.replace(/\.[^.]+$/,'')).slice(0,24),wall:await toURL(wp),bg:await toURL(bg)};
    if(!th.wall&&!th.bg) throw 0; S.themes.push(th); save(); return th.n+' → Themes (wallpaper and background)' }
  return n+': this file type is not supported' }
/* ---------------- fit to window ---------------- */
const EMBED=/embed/.test(location.hash+location.search); if(EMBED) document.documentElement.classList.add('embed');
const FULL=!EMBED&&(!!Host||(matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<600));
if(FULL){ document.documentElement.classList.add('fsm'); PHONE.classList.add('fs') }
function fit(){ const W=280,H=742, wr=$('#wrap'), inn=$('#inner');
  if(FULL){ const vw=innerWidth, vh=innerHeight, s=Math.min(vw/W,vh/H), pw=vw/s, ph=vh/s;
    PHONE.style.width=pw+'px'; PHONE.style.height=ph+'px'; PHONE.style.transform=`scale(${s})`; PHONE.style.setProperty('--sc',`scale(${s})`);
    inn.style.left=(pw-W)/2+'px'; inn.style.top=(ph-H)/2+'px'; wr.style.width=vw+'px'; wr.style.height=vh+'px'; return }
  const g=EMBED?4:32, availH=innerHeight-g, availW=innerWidth-g; const s=Math.max(.5,Math.min(1.4,availH/H,availW/W));
  PHONE.style.transform=`scale(${s})`; PHONE.style.setProperty('--sc',`scale(${s})`); wr.style.width=W*s+'px'; wr.style.height=H*s+'px' }
