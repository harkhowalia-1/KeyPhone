<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KeyPhone built-in Java</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#111;font:14px/1.3 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#screen{position:absolute;inset:0;background:#fff;overflow:auto}
#screen>canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#screen .item{padding:7px 9px;border-bottom:1px solid #ddd;white-space:nowrap;cursor:pointer}
#title,#choice,#back{display:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;background:#000;color:#ddd}
</style>
<script>console.log=console.debug=console.info=function(){};</script>
<!-- JS2ME by Tomasz Szatkowski, MIT licence (see LICENSE). Bundled so Java apps can run with no internet connection. -->
<script src="js/zip/zip.js"></script><script src="js/zip/inflate.js"></script><script src="js/zip/zip-ext.js"></script>
<script src="js/js2me.js"></script><script src="js/bufferStream.js"></script><script src="js/convert.js"></script><script src="js/classes.js"></script>
<script src="js/execute.js"></script><script src="js/events.js"></script><script src="js/manifest.js"></script><script src="js/methodStub.js"></script>
<script src="js/launcher.js"></script><script src="js/loader.js"></script><script src="js/numbers.js"></script><script src="js/resources.js"></script>
<script src="js/threads.js"></script><script src="js/workers.js"></script><script src="js/utils.js"></script>
</head><body>
<div id="title"></div><button id="choice"></button><button id="back"></button>
<div id="screen"></div><div id="msg"></div>
<script>
// Glue between the KeyPhone shell and JS2ME. Same protocol as the online runner:
// parent → {t:'run',jar:ArrayBuffer}, {t:'key',code,down}; runner → {t:'ready'}, {t:'error',text}, {t:'exit'}.
(function(){
  var up=function(m){ try{ parent.postMessage(m,'*') }catch(e){} };
  js2me.config.width=240; js2me.config.height=320; js2me.config.fullHeight=320; js2me.config.workers=false;
  js2me.engine='js/program_'+js2me.config.engine+'.js';
  js2me.setFullscreen=function(){};
  js2me.showError=function(m){ up({t:'error',text:'This application stopped: '+String(m||'').replace(/<[^>]*>/g,'').slice(0,120)}) };
  window.onerror=function(m){ up({t:'error',text:'This application is not supported by the built-in Java engine.'}) };
  var KEY={Digit0:48,Digit1:49,Digit2:50,Digit3:51,Digit4:52,Digit5:53,Digit6:54,Digit7:55,Digit8:56,Digit9:57,NumpadMultiply:42,NumpadDivide:35,ArrowUp:-1,ArrowDown:-2,ArrowLeft:-3,ArrowRight:-4,Enter:-5,F1:-6,F2:-7};
  var soft=function(id){ var b=document.getElementById(id); if(!b) return; var ev=document.createEvent('MouseEvents'); ev.initEvent('mousedown',true,true); b.dispatchEvent(ev) };
  addEventListener('message',function(e){ var m=e.data||{};
    if(m.t==='run'&&m.jar){ try{ js2me.launchJAR(new Blob([m.jar])) }catch(err){ up({t:'error',text:'The application could not start.'}) } }
    else if(m.t==='key'){ var c=KEY[m.code]; if(c==null) return;
      if(m.down){ if(c===-6&&!document.querySelector('#screen>canvas')) soft('choice'); else if(c===-7&&!document.querySelector('#screen>canvas')) soft('back'); js2me.sendKeyPressEvent(c) }
      else js2me.sendKeyReleasedEvent(c) } });
  document.getElementById('screen').addEventListener('click',function(e){ var it=e.target.closest&&e.target.closest('.item'); if(it&&it.onclick) it.onclick() });
  up({t:'ready',engine:'lite'});
})();
</script>
</body></html>
